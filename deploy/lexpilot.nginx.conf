server {
    listen 80;
    listen [::]:80;
    server_name lexpilot.mizki.online;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/qingdun-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://lexpilot.mizki.online$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lexpilot.mizki.online;
    ssl_certificate /etc/letsencrypt/live/lexpilot.mizki.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lexpilot.mizki.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    limit_req_status 429;
    location ~ ^/api/cases/[^/]+/(analysis|materials/[^/]+/ocr)$ {
        limit_req zone=qingdun_ai burst=3 nodelay;
        proxy_pass http://127.0.0.1:8266;
    }
    location /api/ {
        limit_req zone=qingdun_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8266;
    }
    location / {
        proxy_pass http://127.0.0.1:8266;
    }
}
