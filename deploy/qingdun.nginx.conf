limit_req_zone $binary_remote_addr zone=qingdun_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=qingdun_ai:1m rate=6r/m;
server {
    listen 8083 ssl;
    listen [::]:8083 ssl;
    server_name pingpop.mizki.online;
    ssl_certificate /etc/letsencrypt/live/pingpop.mizki.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pingpop.mizki.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://lexpilot.mizki.online$request_uri;
}
